<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account page</title>
    <!-- Link CSS & JavaScript-->
    <link rel="stylesheet" href="../../css/style.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="./acc.css" />
    <script src="./acc.js" defer></script>
    <!-- chart js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Include jQuery (since Notify.js depends on it) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Include Notify.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noty/3.1.4/noty.min.js"></script>

    <link rel="icon" href="../../image/user-icon.png">


  </head>

  <body>
    <div class="container-website">
      <div class="left-side">
        <div class="expense-title">
          <i class="fa-solid fa-wallet"></i>
          <span class="span-expense">Expense</span>
        </div>
        <div class="pages">
          <div class="page-icon">
            <i class="fa-solid fa-list icon"></i>
            <p><a href="../../index.html">DASHBOARD</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-money-bill-transfer icon"></i>
            <p><a href="../transaction/transaction.html">TRANSACTION</a></p>
          </div>
          <div class="page-icon active">
            <i class="fa-solid fa-user icon"></i>
            <p><a href="../account/account.html">ACCOUNT</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-gear icon"></i>
            <p><a href="#">SETTING</a></p>
          </div>
        </div>
        <button class="btn-2" id="logoutButton">Log out</button>
      </div>
      <div class="right-side">
        <h1>ACCOUNT</h1>
        <div class="user-account">
          <div class="profile-home">
            <img src="../../image/user-icon.png" alt="" />
            <div class="morning">
              <p>Good morning <span>User</span></p>
              <p>Let's manage your wallet finance</p>
            </div>
          </div>
          <div class="summary">
            <div class="card" id="the-total-card">
              <h5>Total Saving</h5>
              <p id="total-saving" class="fw-bold text-success">$0.00</p>
              <div id="saving-input-container" style="display: none">
                <input
                  type="number"
                  id="saving-input"
                  class="input"
                  placeholder="Enter Amount"
                />
                <button id="add-saving-btn" class="btn">Add</button>
                <button id="cancel-saving-btn" class="btn btn-cancel">
                  Cancel
                </button>
              </div>
              <button id="show-input-btn" class="btn">Add Saving</button>
            </div>

            <div class="card" id="the-income-card">
              <h5>Total Income</h5>
              <p id="total-income" class="fw-bold text-success">$0.00</p>
            </div>
            <div class="card" id="the-expense-card">
              <h5>Total Expenses</h5>
              <p id="total-expenses" class="fw-bold text-danger">$0.00</p>
            </div>
          </div>
        </div>

        <div class="container-account">
          <div id="app-content" class="app-content">
            <!-- Transaction Form -->
            <form id="transaction-form" class="form">
              <div>
                <select id="transaction-category" class="select" required>
                  <option value="">Select Category</option>
                  <option value="Food">Food</option>
                  <option value="Rent">Rent</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Transportation">Transportation</option>
                  <option value="Insurance">Insurance</option>
                  <option value="Debt Payments">Debt Payments</option>
                  <option value="Utilities">Utilities</option>
                </select>
              </div>
              <div>
                <input
                  type="number"
                  id="transaction-amount"
                  class="input"
                  placeholder="Amount"
                  required
                />
              </div>
              <div>
                <select id="transaction-months" class="select" required>
                  <option value="">Select Months</option>
                  <option value="1">January</option>
                  <option value="2">Febuary</option>
                  <option value="3">March</option>
                  <option value="4">April</option>
                  <option value="5">May</option>
                  <option value="6">June</option>
                  <option value="7">July</option>
                  <option value="8">August</option>
                  <option value="9">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>
              <div>
                <button type="submit" class="btn">Add</button>
              </div>
              <!-- Button to show the report -->
              <div>
                <button type="submit" class="btn-report" id="btn-report">
                  Report
                </button>
              </div>

              <!-- Chart container with cancel button -->
              <div id="chart-container" style="display: none">
                <!-- Cancel button (X) -->
                <button
                  id="btn-cancel"
                  class="btn-cancel"
                  style="
                    position: absolute;
                    top: 10px;
                    right: 10px;
                    font-size: 30px;
                    cursor: pointer;
                  "
                >
                  &times;
                </button>

                <!-- Canvas for chart -->
                <canvas id="myChart"></canvas>
              </div>
            </form>

            <!-- Transactions Table -->
            <div class="table-container">
              <table class="table">
                <thead>
                  <tr>
                    <th>Check out</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Months</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="transaction-list">
                  <!-- Transaction Rows Go Here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
