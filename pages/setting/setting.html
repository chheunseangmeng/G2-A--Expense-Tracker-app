<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setting page</title>
    <!-- Link CSS & JavaScript-->
    <link rel="stylesheet" href="/pages/setting/set.css" />
    <script src="/pages/setting/set.js" defer></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- firebase link database -->   
    <script type="module" src="/js/firebase.js" defer></script>
    <link rel="icon" href="../../image/setting.png">
    <link rel="stylesheet" href="../../css/style.css">
  </head> 
        
  <body> 
    <div class="container-website">
      <div class="left-side">
        <div class="expense-title">
          <i class="fa-solid fa-wallet"></i>
          <span class="span-expense">Expense</span>
        </div>
        <div class="pages">
          <div class="page-icon">
            <i class="fa-solid fa-list icon"></i>
            <p><a href="/index.html">DASHBOARD</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-money-bill-transfer icon"></i>
            <p><a href="/pages/transaction/transaction.html">TRANSACTION</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-user icon"></i>
            <p><a href="/pages/account/account.html">ACCOUNT</a></p>
          </div>
          <div class="page-icon active">
            <i class="fa-solid fa-gear icon"></i>
            <p><a href="#">SETTING</a></p>
          </div>
        </div>
        <button class="btn-2">
          <a href="#" style="text-decoration: none">Log Out</a>
        </button>
      </div>
      <!-- right bar -->
      <div class="right-side">
        <i class="fa-solid fa-list-ul"></i>
        <h1>DASHBOARD</h1>
        <div class="login_form">
          <!-- Login form container -->
           <div class="setting-form">
            <h2>SETTING</h2>
            <form id="settingForm">
              <div class="setting-form-group">
                <label for="password">Change Name</label>
                <input type="password" id="password" placeholder="Enter new name" required>
                <button type="button" class="btn-view" onclick="enableEdit('email')">Edit</button>
              </div>
              <div class="setting-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <button type="button" class="btn-view" onclick="toggleVisibility('password')">Show</button>
              </div>
              <div class="setting-form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                <button type="button" class="btn-view" onclick="toggleVisibility('confirmPassword')">Show</button>
              </div>
              <div class="setting-form-group">
                <button type="submit" class="btn-1">Update</button>
              </div>
            </form>
           </div>
        </div>
      </div>
    </div>
  </body>
</html>
