<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setting page</title>
    <!-- Link CSS & JavaScript-->
    <link rel="stylesheet" href="/pages/setting/set.css" />
    <script src="/pages/setting/set.js" defer></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- firebase link database -->
    <script type="module" src="/js/firebase.js" defer></script>
    <link rel="icon" href="../../image/setting.png" />
    <link rel="stylesheet" href="../../css/style.css" />
  </head>

  <body>
    <div class="container-website">
      <header class="mobile-header">
        <button id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      </header>
      
      <div class="left-side">
        <div class="expense-title">
          <i class="fa-solid fa-wallet"></i>
          <span class="span-expense">Expense</span>
        </div>
        <div class="pages">
          <div class="page-icon">
            <i class="fa-solid fa-list icon"></i>
            <p><a href="../../index.html">DASHBOARD</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-money-bill-transfer icon"></i>
            <p><a href="../transaction/transaction.html">TRANSACTION</a></p>
          </div>
          <div class="page-icon">
            <i class="fa-solid fa-user icon"></i>
            <p><a href="../account/account.html">ACCOUNT</a></p>
          </div>
          <div class="page-icon active">
            <i class="fa-solid fa-gear icon"></i>
            <p><a href="../setting/setting.html">SETTING</a></p>
          </div>
        </div>
        <button class="btn-2" id="logoutButton">Log out</button>
      </div>
      
      <!-- right bar -->
      <div class="right-side">
        <h1>DASHBOARD</h1>
        <div class="user-account">
          <div class="profile-home">
            <img src="../../image/user-icon.png" alt="" />
            <div class="morning">
              <p>Good morning <span>User</span></p>
              <p>Let's manage your wallet finance</p>
            </div>
          </div>
          <div class="save"> <button>Save change</button></div>
        </div>
          <h3>Change Profile Setting</h3>
          <div class="form-setting">
            <div class="set-group">
              <label for="firstname">First name</label> <br>
              <input type="text" class="user-name-set" placeholder="First name">
            </div>
            <div class="set-group">
              <label for="lastname">last name</label> <br>
              <input type="text" class="user-name-set" placeholder="Last name">
            </div>
            <div class="set-group">
              <label for="password">Password</label> <br>
              <input type="text" class="user-name-set" placeholder="Password">
            </div>
            <div class="set-group">
              <label for="comfirmpassword">Comfirm password</label> <br>
              <input type="text" class="user-name-set" placeholder="Comfirm password">
            </div>
          </div>
          <button class="go-home"><a href="../../index.html">Go to the Dashbaord page  <i class="fa-solid fa-arrow-up-from-bracket"></i></a></button>
    </div>
  </body>
</html>
