<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker App</title>
    <!-- Link CSS & JavaScript-->
    <link rel="stylesheet" href="../../css/style.css" />
    <script src="../../js/main.js" defer></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <!-- SweetAlert CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- firebase link database -->
    <script type="module" src="../../js/firebase.js" defer></script>


    <!-- <script src="./acc.js"defer></script> -->
    <link rel="stylesheet" href="./tran.css">
    <script src="./tran.js" defer></script>

    <link rel="icon" href="../../image/dollar-tran.png">
  </head>

  <body>
   
    <div class="container-website">
        <div class="left-side">
          <div class="expense-title">
            <i class="fa-solid fa-wallet"></i>
            <span class="span-expense">Expense</span>
          </div>
          <div class="pages">
            <div class="page-icon ">
              <i class="fa-solid fa-list icon"></i>
              <p><a href="../../index.html">DASHBOARD</a></p>
            </div>
            <div class="page-icon  active">
              <i class="fa-solid fa-money-bill-transfer icon"></i>
              <p><a href="../transaction/transaction.html">TRANSACTION</a></p>
            </div>
            <div class="page-icon ">
              <i class="fa-solid fa-user icon"></i>
              <p><a href="../account/account.html">ACCOUNT</a></p>
            </div>
            <div class="page-icon">
              <i class="fa-solid fa-gear icon"></i>
              <p><a href="/pages/setting/setting.html">SETTING</a></p>
            </div>
          </div>
          <button class="btn-2" id="logoutButton">Log out</button>
        </div>
        <div class="right-side">
          <i class="fa-solid fa-list-ul"></i>
          <h1>TRANSACTION</h1>
          <div class="user-account">
            <div class="summary">

          <div class="container-account">
            <div id="app-content" class="app-content">
              <!-- Transaction Form -->
              <form id="transaction-form" class="form">
                <div>
                  <select id="transaction-category" class="select" required>
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Insurance">Insurance</option>
                    <option value="Debt Payments">Debt Payments</option>
                    <option value="Utilities">Utilities</option>
                  </select>
                </div>
                <div>
                  <input
                    type="number"
                    id="transaction-amount"
                    class="input"
                    placeholder="Amount"
                    required
                  />
                </div>
                <div>
                  <select id="transaction-months" class="select" required>
                    <option value="">Select Months</option>
                    <option value="1">January</option>
                    <option value="2">Febuary</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                  </select>
                </div>
                <div>
                  <button type="submit" class="btn">Add</button>
                </div>
              </form>
              <!-- Transactions Table -->
              <div class="table-container">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Check out</th>
                      <th>Category</th>
                      <th>Amount</th>
                      <th>Months</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="transaction-list">
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
  </body>
</html>
